services:
  - type: web
    name: nyaysathi-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: Legal_AI
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CHROMA_PATH
        value: /app/chroma_db
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: "8000"
    healthCheckPath: /health
